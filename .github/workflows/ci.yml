name: Baseline CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baseline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate structured files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.21,<5" "PyYAML>=6,<7"
      - name: Validate JSON, YAML and JSON Schemas
        run: python scripts/ci/validate_structured_files.py
