name: Knowledge Doc Drift

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  drift:
    name: Knowledge-doc drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check obsidian-gbrain doc against canonical semantics
        run: python scripts/ci/check_knowledge_doc.py
